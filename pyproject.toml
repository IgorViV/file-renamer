[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-renamer"
dynamic = ["version"]
description = "CLI для массового переименования дат в именах файлов, папок и ярлыков"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "colorama>=0.4.6",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.scripts]
file-renamer = "file_renamer:main_menu"

[tool.setuptools]
py-modules = ["file_renamer"]

[tool.setuptools.dynamic]
version = { attr = "file_renamer.__version__" }

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
python_version = "3.9"

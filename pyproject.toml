[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-renamer"
dynamic = ["version"]
description = "CLI для массового переименования дат в именах файлов, папок и ярлыков"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Igor Vlashchenko" }]
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.scripts]
file-renamer = "file_renamer:main_menu"

[tool.setuptools]
py-modules = ["file_renamer"]

[tool.setuptools.dynamic]
version = { attr = "file_renamer.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# широкие перехваты нужны на границах операций, чтобы одна ошибка не роняла обход;
# RUF001-003 не нужны: в русских строках кириллица и латиница визуально совпадают
ignore = ["BLE001", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["colorama", "win32com.*"]
ignore_missing_imports = true

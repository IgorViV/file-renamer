[package]
name = "file-renamer"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
description = "CLI для массового переименования дат в именах файлов, папок и ярлыков"
license = "MIT"
readme = "README.md"
default-run = "file-renamer"

[lib]
name = "file_renamer"
path = "src/lib.rs"

[[bin]]
name = "file-renamer"
path = "src/main.rs"

[[bin]]
name = "create-test-data"
path = "src/bin/create-test-data.rs"

[dependencies]
ratatui = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
